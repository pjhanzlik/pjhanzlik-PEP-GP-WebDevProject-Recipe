<!-- 
 This file contains the structure for the main register page of the Recipe Management Application,
 providing a user registration form with fields for username, email, and password.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - User Registration Page</title>
    <link rel="stylesheet" href="../styles.css" />
</head>
<body>
    <main>
    <form method="post" action="http://localhost:8081/register">
    <!-- Add a heading (h1) with text "Register" -->
    <h1>Register Page</h1>

    <!-- Add a label or paragraph for "Username" -->
    <label for="username-input">Username</label>
    <!-- Add an input element for username with id="username-input" -->
    <input autocomplete="username" name="username" id="username-input" required />

    <!-- Add a label or paragraph for "Email" -->
    <label for="email-input">Email</label>
    <!-- Add an input element for email with id="email-input" and type="email" -->
    <input autocomplete="email" name="email" id="email-input" type="email" required />

    <!-- Add a label or paragraph for "Password" -->
    <label for="password-input">Password</label>
    <!-- Add an input element for password with id="password-input" and type="password" -->
    <input autocomplete="new-password" name="password" id="password-input" type="password" required />

    <!-- Add a label or paragraph for "Repeat Password" -->
    <label for="repeat-password-input">Repeat Password</label>
    <!-- Add an input element for repeat password with id="repeat-password-input" and type="password" -->
    <input autocomplete="new-password" id="repeat-password-input" type="password" required />

    <!-- Add a register button with id="register-button" and text "Register" -->
    <button id="register-button">Register</button>
    </form>
    </main>

    <script src="register-page.js"></script>
</body>
</html>
