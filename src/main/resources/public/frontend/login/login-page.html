<!-- 
 This file contains the structure for the login page of the Recipe Management Application.
 It provides a form for users to enter their credentials and log into the system.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Recipe Management App</title>
    <link rel="stylesheet" href="../styles.css" />
</head>
<body>
    <main>
    <form method="post" action="http://localhost:8081/login">
    <!-- Add main heading for the page -->
    <h1>Login Page</h1>

    <!-- Create an input field for username -->
    <label for="login-input">Username</label>
    <input autocomplete="username" name="username" id="login-input" required placeholder="user" />
    <!-- - Use <input> with id="login-input" and appropriate placeholder -->

    <!-- Create an input field for password -->
    <label for="password">Password</label>
    <input autocomplete="current-password" name="password" type="password" id="password-input" required />
    <!-- - Use <input type="password"> with id="password-input" -->

    <!-- Create a login button -->
    <button id="login-button">Login</button>
    <!-- - Use <button> with id="login-button" -->

    <!-- TODO: Add an optional hidden logout button with id="logout-button" -->
    <!-- - Can be revealed if needed during token testing or logout support -->
    </form>
    </main>

    <!-- Link JS script -->
    <script src="login-page.js"></script>
</body>
</html>
